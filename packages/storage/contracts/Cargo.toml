[package]
name = "flow-like-storage-contracts"
version = "0.1.0"
edition = "2024"

[features]
default = ["all"]
all = ["graph", "vector", "database"]
database = ["dep:schemars", "dep:serde", "dep:flow-like-types-contracts"]
graph = ["dep:schemars", "dep:serde"]
vector = ["dep:arrow-schema"]

[dependencies]
anyhow = "1"
arrow-schema = { version = "=58.4.0", features = ["serde"], optional = true }
async-trait = "0.1.89"
flow-like-types-contracts = { workspace = true, features = ["data-classification"], optional = true }
schemars = { version = "1.1.0", features = ["preserve_order"], optional = true }
serde = { version = "1.0.219", features = ["derive", "rc"], optional = true }
serde_json = "1.0.134"
