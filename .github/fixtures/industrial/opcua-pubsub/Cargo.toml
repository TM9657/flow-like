[package]
name = "flow-like-opcua-pubsub-container"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "flow_like_industrial"
path = "lib.rs"

[features]
default = ["opcua-pubsub"]
opcua-pubsub = []

[dependencies]
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"
fs2 = "0.4"
libc = "0.2"
zeroize = { version = "1", features = ["derive"] }
anyhow = "=1.0.104"
schemars = "=1.2.1"
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.18"
serde_json = "=1.0.151"
tokio = { version = "=1.52.3", features = ["net", "time", "sync", "rt", "macros", "rt-multi-thread"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }
socket2 = { version = "=0.6.3", features = ["all"] }

[[test]]
name = "opcua_pubsub_e2e"
path = "../../../../packages/industrial/tests/opcua_pubsub_e2e.rs"

[profile.test]
debug = 0
