name: Setup repository Rust toolchain
description: Installs the compiler and components pinned in rust-toolchain.toml.

inputs:
  targets:
    description: Additional compilation targets, separated by commas
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install pinned Rust toolchain
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        RUST_TARGETS: ${{ inputs.targets }}
      run: |
        # Retry the whole command when a component download aborts the install.
        retry_rustup() {
          local attempt status delay=5
          for attempt in 1 2 3 4 5; do
            if rustup "$@"; then
              return 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::rustup $* failed after $attempt attempts."
              return "$status"
            fi
            echo "::warning::rustup $* failed (attempt $attempt/5); retrying in ${delay}s."
            sleep "$delay"
            delay=$((delay * 2))
          done
        }

        unset RUSTUP_TOOLCHAIN
        retry_rustup toolchain install
        toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
        if [ -n "$RUST_TARGETS" ]; then
          IFS=',' read -r -a targets <<< "$RUST_TARGETS"
          retry_rustup target add "${targets[@]}"
        fi
        rustc --version --verbose
        echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
