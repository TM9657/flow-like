[package]
name = "aws-api"
version = "0.1.0"
edition = "2024"

[dependencies]
flow-like = { workspace = true, features = ["app-runtime"] }
# `dynamodb` and `s3` must stay enabled here: without them EXECUTION_STATE_BACKEND and
# CACHE_BACKEND silently fall back to Postgres on the serverless target.
flow-like-api = { workspace = true, features = ["aws", "cognito", "ses", "smtp", "sendgrid", "lambda", "sqs", "secrets-aws", "dynamodb", "s3", "channel-aws", "otel", "forecasting"] }
flow-like-aws-data = { workspace = true }
flow-like-secrets = { workspace = true, features = ["aws"] }
flow-like-types.workspace = true
flow-like-storage.workspace = true
# Match the Lambda executors' ONNX catalog without linking ONNX execution.
# Data Studio forecasts use the separate native CPU forecasting runtime above.
flow-like-catalog = { workspace = true, features = ["server-local-metadata"] }
mimalloc.workspace = true
lambda_http.workspace = true
axum.workspace = true
tower.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
hyper.workspace = true

chrono.workspace = true

[dev-dependencies]
hyper-util.workspace = true
